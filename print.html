<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出荷指示書の印刷</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  :root{ --ink:#132a2e; --line:#c8d3cf; --brand:#0f6e5c; --brand-dark:#0a4d40; --ng:#c23b2f; --ng-bg:#fbe7e4; --paper:#f3f6f4; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;}

  /* ---- 画面(一覧) ---- */
  .screen-only{max-width:960px;margin:0 auto;padding:20px 16px 40px;background:#fff;min-height:100vh;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{font-size:13px;color:#5a6b66;margin-bottom:14px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .toolbar button{border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-main{background:var(--brand);color:#fff;}
  .btn-sub{background:#eef2f0;color:var(--brand-dark);}
  .toolbar .count{font-size:14px;color:#5a6b66;margin-left:auto;}
  table.list{width:100%;border-collapse:collapse;font-size:14px;}
  table.list th, table.list td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;}
  table.list th{font-size:12px;color:#5a6b66;}
  tr.warn td{color:var(--ng);background:#fff7f6;}
  td.items{font-size:13px;}
  .key-panel{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
  .key-title{font-size:16px;font-weight:800;}
  .key-hint{font-size:13px;color:#5a6b66;margin-top:4px;}
  .manual-entry{margin-top:10px;display:flex;gap:8px;}
  .manual-entry input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;}
  .manual-entry button{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:700;}
  .msg{font-size:14px;color:var(--ng);font-weight:700;margin:10px 0;}

  /* ---- 印刷(出荷指示書) ---- */
  #printArea{display:none;}
  @page{size:A4 portrait;margin:0;}
  @media print{
    body{background:#fff;}
    .screen-only{display:none !important;}
    body > [role="status"]{display:none !important;}   /* 「接続キーを保存しました」等の通知を写さない */
    #printArea{display:block;}
  }
  /* A4 1枚に 2列×3段（1枠 105×99mm）。商品が多い注文は縦2枠、それでも収まらなければ1ページを使う */
  .sheet{width:210mm;height:297mm;page-break-after:always;break-after:page;overflow:hidden;
         display:grid;grid-template-columns:repeat(2,105mm);grid-template-rows:repeat(3,99mm);}
  .sheet.whole{display:block;height:auto;min-height:297mm;overflow:visible;}
  .sheet:last-child{page-break-after:auto;break-after:auto;}
  .slip{padding:5mm 5mm 3.5mm;overflow:hidden;display:flex;flex-direction:column;min-width:0;}
  .sheet.whole .slip{width:210mm;min-height:297mm;padding:10mm 12mm 8mm;overflow:visible;}
  /* 切り取り線（枠と枠の間だけ。縦2枠の注文の途中には引かない） */
  .slip.cut-r{border-right:0.2mm dashed #aaa;}
  .slip.cut-b{border-bottom:0.2mm dashed #aaa;}
  .slip .top{display:flex;justify-content:space-between;align-items:center;gap:3mm;margin-bottom:1.5mm;}
  .slip .channel{font-size:10pt;font-weight:800;border:0.35mm solid #000;border-radius:1.5mm;padding:0.3mm 2.5mm;white-space:nowrap;}
  .slip .stamp{font-size:7pt;color:#333;white-space:nowrap;}
  /* バーコードは枠の幅いっぱいに横へ伸ばす（全バーが同じ倍率で伸びるので、線の太さの比は変わらない） */
  .slip svg.bc{display:block;width:100%;height:13mm;}
  .sheet.whole .slip svg.bc{width:120mm;height:16mm;margin:0 auto;}
  /* 1ページに収まらない注文は次のページへ続ける（行の途中では切らない。続きのページにも余白・表の見出し・注文番号を出す） */
  .sheet.whole .slip{-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .sheet.whole .slip tr{break-inside:avoid;}
  .sheet.whole .slip .pkg{break-before:avoid;}   /* 梱包資材だけが次のページに残らないよう、最後の商品行と一緒に送る */
  .slip thead .cont{display:none;}
  .sheet.whole .slip thead .cont{display:table-row;}
  .slip thead .cont th{background:#fff;border:none;padding:0 0 1mm;font-size:8pt;font-weight:400;color:#555;}
  .slip .order-no{font-family:Consolas,monospace;font-size:10pt;text-align:center;margin-top:0.8mm;letter-spacing:.02em;}
  .slip .dest{font-size:15pt;font-weight:900;margin:2mm 0 1.8mm;line-height:1.2;word-break:break-all;}
  .slip table{width:100%;border-collapse:collapse;font-size:9.5pt;line-height:1.3;}
  .slip th, .slip td{border:0.25mm solid #000;padding:0.9mm 1.5mm;}
  .slip th{background:#eee;font-size:7.5pt;text-align:left;}
  .slip td.qty{width:13mm;text-align:center;font-size:13pt;font-weight:900;}
  .slip .pkg{margin-top:1.8mm;font-size:9pt;line-height:1.3;}
  .slip .pkg b{font-size:10.5pt;}
  .slip .pkg .note{font-size:7.5pt;}
  .slip .foot{margin-top:auto;padding-top:1.2mm;font-size:6.5pt;color:#555;display:flex;justify-content:space-between;gap:2mm;}
  /* 高さの計測用（画面外。1枠の幅で、高さは中身なり） */
  .measure{position:absolute;left:-10000px;top:0;visibility:hidden;}
  .measure .slip{width:105mm;}
  /* ---- 印刷(ピッキングリスト。A4縦。作業所スタッフ向けに文字は大きく、1行の情報は少なく。個人情報は載せない) ---- */
  #pickArea{display:none;}
  @page picklist{size:A4 portrait;margin:11mm 11mm 13mm;
    @bottom-right{content:counter(page) " / " counter(pages);font-size:10pt;color:#555;}}
  @media print{
    body.print-pick #printArea{display:none !important;}
    body.print-pick #pickArea{display:block;}
  }
  .pick{page:picklist;font-size:12pt;color:#000;}
  .pick .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:0.6mm solid #000;padding-bottom:1.5mm;}
  .pick h2{font-size:22pt;margin:0;}
  .pick .meta{font-size:11pt;text-align:right;line-height:1.4;}
  .pick .notice{font-size:10.5pt;margin:2mm 0 0;}
  .pick table{width:100%;border-collapse:collapse;margin-top:3mm;}
  .pick th{font-size:10pt;font-weight:700;text-align:left;border-bottom:0.4mm solid #000;padding:1mm 2mm;}
  .pick td{border-bottom:0.25mm solid #777;padding:2mm 2mm;vertical-align:middle;}
  .pick tr{break-inside:avoid;}
  .pick td.chk{width:13mm;padding-right:0;}
  .pick td.chk span{display:block;width:9mm;height:9mm;border:0.6mm solid #000;}
  .pick td.shelf{width:30mm;font-size:17pt;font-weight:800;font-family:Consolas,"Yu Gothic",monospace;white-space:nowrap;}
  .pick td.shelf.none{font-size:11pt;font-weight:400;color:#555;}
  .pick td.shelf small{display:block;font-size:9pt;font-weight:400;}
  .pick td.name{font-size:14pt;font-weight:700;line-height:1.3;word-break:break-all;}
  .pick td.name .jan{display:block;font-size:10pt;font-weight:400;font-family:Consolas,monospace;color:#333;margin-top:0.5mm;}
  .pick .tag{display:inline-block;font-size:9.5pt;font-weight:800;border:0.4mm solid #000;border-radius:1mm;padding:0 1.5mm;margin-left:2mm;vertical-align:0.3em;}
  .pick .tag.warn{background:#000;color:#fff;}
  .pick td.qty{width:28mm;text-align:right;font-size:28pt;font-weight:900;white-space:nowrap;}
  .pick td.qty small{font-size:12pt;font-weight:700;}
  .pick td.cnt{width:20mm;text-align:right;font-size:12pt;white-space:nowrap;}
  .pick tr.sep td{border-bottom:0.4mm solid #000;padding:4mm 2mm 1mm;font-size:11pt;font-weight:800;}
  .pick .total{display:flex;justify-content:flex-end;align-items:baseline;gap:6mm;border-top:0.6mm solid #000;margin-top:-0.25mm;padding-top:2mm;font-size:14pt;font-weight:800;break-inside:avoid;}
  .pick .total b{font-size:28pt;font-weight:900;}
  .pick .warn-list{margin-top:5mm;font-size:10.5pt;border:0.4mm solid #000;padding:2mm 3mm;break-inside:avoid;}
  .pick .warn-list div{margin-top:0.8mm;font-family:Consolas,"Yu Gothic",monospace;}
  .toolbar label{font-size:14px;display:flex;align-items:center;gap:4px;}
  tr.printed td{color:#8a9a95;}
</style>
</head>
<body>
<div class="screen-only">
  <h1>出荷指示書の印刷</h1>
  <div class="sub">本日出荷リストの「未処理」で、まだ印刷していない注文を表示しています（注文日時の古い順）。
    A4 1枚に6件（2列×3段、切り取り線つき。商品が多い注文は縦2枠または1ページ）。警告がある注文（赤字）は梱包できないため印刷できません。
    「ピッキングリスト印刷」は、未処理の注文すべての自社出荷(毛呂山)の商品を、棚番号順の総量リストにして印刷します（A4縦）。</div>
  <div id="keyArea"></div>
  <div class="toolbar">
    <button class="btn-sub" id="reloadBtn">一覧を更新</button>
    <button class="btn-sub" id="allBtn">印刷できる注文をすべて選択</button>
    <button class="btn-sub" id="noneBtn">選択を解除</button>
    <label><input type="checkbox" id="showPrinted"> 印刷済みも表示</label>
    <button class="btn-main" id="printBtn">選択した注文を印刷</button>
    <button class="btn-main" id="pickBtn">ピッキングリスト印刷</button>
    <button class="btn-sub" id="changeKeyBtn">接続キーを変更</button>
    <span class="count" id="count"></span>
  </div>
  <div class="msg" id="msg"></div>
  <table class="list">
    <thead><tr><th></th><th>注文日時</th><th>注文番号</th><th>チャネル</th><th>お届け先</th><th>商品（セットは単品に展開済み）</th><th>梱包資材(目安)</th><th>印刷日時</th><th>警告</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="printArea"></div>
<div id="pickArea"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="picklist.js"></script>
<script>
const { apiGet, apiPost, estimatePackage, escapeHtml } = window.Common;
let allPending = [];   // 未処理の注文（注文日時の古い順）
let shown = [];        // 表示中の注文

async function load() {
  const msg = document.getElementById("msg");
  msg.textContent = "読み込み中…";
  try {
    allPending = ((await apiGet("list")).orders || []).filter(o => o.status === "未処理");
  } catch (e) {
    msg.textContent = e.message;
    return;
  }
  // 注文日時の古い順（注文日時が無いものは最後、同じなら注文番号順）
  allPending.sort((a, b) => (a.orderedAt || "9999").localeCompare(b.orderedAt || "9999") || a.orderId.localeCompare(b.orderId));
  render();
}

function render() {
  const showPrinted = document.getElementById("showPrinted").checked;
  shown = allPending.filter(o => showPrinted || !o.printedAt);
  const msg = document.getElementById("msg");
  msg.textContent = shown.length ? "" : (showPrinted ? "未処理の注文はありません。" : "まだ印刷していない未処理の注文はありません。");
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  shown.forEach((o, i) => {
    const pkg = estimatePackage(o.items);
    const tr = document.createElement("tr");
    tr.className = o.warning ? "warn" : (o.printedAt ? "printed" : "");
    // 未印刷で警告の無い注文は最初から選択済み（印刷済みは再印刷になるので選択しない）
    const checked = !o.warning && !o.printedAt;
    tr.innerHTML = `
      <td><input type="checkbox" data-i="${i}" ${o.warning ? "disabled" : ""} ${checked ? "checked" : ""}></td>
      <td>${escapeHtml(o.orderedAt)}</td>
      <td>${escapeHtml(o.orderId)}</td>
      <td>${escapeHtml(o.channel)}</td>
      <td>${escapeHtml(o.customer)}</td>
      <td class="items">${o.items.map(it => `${escapeHtml(it.name)} ×${it.qty}`).join("<br>")}</td>
      <td>${escapeHtml(pkg.name)}</td>
      <td>${escapeHtml(o.printedAt ? o.printedAt.slice(0, 16) : "未印刷")}</td>
      <td>${escapeHtml(o.warning)}</td>`;
    tbody.appendChild(tr);
  });
  updateCount();
}

function selected() {
  return [...document.querySelectorAll("#rows input:checked")].map(c => shown[+c.dataset.i]);
}
function updateCount() {
  const unprinted = allPending.filter(o => !o.printedAt && !o.warning).length;
  document.getElementById("count").textContent =
    `選択 ${selected().length}件 / 未印刷 ${unprinted}件（未処理 ${allPending.length}件）`;
}
document.getElementById("rows").addEventListener("change", updateCount);
document.getElementById("showPrinted").addEventListener("change", render);
document.getElementById("reloadBtn").addEventListener("click", load);
document.getElementById("allBtn").addEventListener("click", () => {
  document.querySelectorAll("#rows input:not(:disabled)").forEach(c => c.checked = true); updateCount();
});
document.getElementById("noneBtn").addEventListener("click", () => {
  document.querySelectorAll("#rows input").forEach(c => c.checked = false); updateCount();
});
document.getElementById("changeKeyBtn").addEventListener("click", () => {
  window.Common.changeKey(document.getElementById("keyArea"), load);
});

/** 印刷記録の「端末」列用（任意の目安。どのPC・ブラウザで印刷したか） */
function deviceName() {
  const ua = navigator.userAgent;
  const os = /Windows/.test(ua) ? "Windows" : /Mac OS/.test(ua) ? "Mac" : /Android/.test(ua) ? "Android"
           : /iPhone|iPad/.test(ua) ? "iOS" : "その他";
  const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox"
           : /Safari\//.test(ua) ? "Safari" : "ブラウザ";
  return `print.html ${os} ${br}`;
}

function slipHtml(o, printedAt, no, total) {
  const pkg = estimatePackage(o.items);
  return `
    <div class="slip">
      <div class="top">
        <span class="channel">${escapeHtml(o.channel)}</span>
        <span class="stamp">印刷 ${escapeHtml(printedAt)}　${no}/${total}</span>
      </div>
      <svg class="bc" data-code="${escapeHtml(o.orderId)}"></svg>
      <div class="order-no">${escapeHtml(o.orderId)}</div>
      <div class="dest">${escapeHtml(o.customer)}</div>
      <table>
        <thead><tr class="cont"><th colspan="2">注文番号 ${escapeHtml(o.orderId)}（${escapeHtml(o.customer)}）</th></tr>
          <tr><th>商品名</th><th style="text-align:center;">数量</th></tr></thead>
        <tbody>${o.items.map(it => `<tr><td>${escapeHtml(it.name)}</td><td class="qty">${it.qty}</td></tr>`).join("")}</tbody>
      </table>
      <div class="pkg">梱包資材(目安): <b>${escapeHtml(pkg.name)}</b> <span class="note">${escapeHtml(pkg.note || "")}</span></div>
      <div class="foot"><span>出荷指示書（照合ツールのSTEP1で読み取る）</span><span>注文日時 ${escapeHtml(o.orderedAt || "-")}</span></div>
    </div>`;
}

// CODE128。1モジュール=1単位で作り、CSSで枠の幅いっぱいに横へ伸ばす。
// 左右の余白(クワイエットゾーン)は10モジュール。楽天の26文字の注文番号で約250モジュール → 1モジュール約0.38mm
function renderBarcodes(root) {
  root.querySelectorAll("svg.bc").forEach(svg => {
    JsBarcode(svg, svg.dataset.code, { format: "CODE128", width: 1, height: 40, margin: 10, displayValue: false });
    svg.removeAttribute("width");
    svg.removeAttribute("height");
    svg.removeAttribute("style");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("shape-rendering", "crispEdges");
  });
}

const MM = 96 / 25.4;               // CSSの1mm(px)
const COLS = 2, ROWS = 3, CELL_H = 99;

// 各指示書の中身の高さを1枠の幅で測り、使う枠の数を決める（文字を縮めずに収めるため）
//   1 = 1枠 / 2 = 縦2枠 / 0 = 1ページ（縦2枠でも収まらない）
function measureSpans(htmls) {
  const box = document.createElement("div");
  box.className = "measure";
  box.innerHTML = htmls.join("");
  document.body.appendChild(box);
  renderBarcodes(box);
  const spans = [...box.children].map(el => {
    const h = el.getBoundingClientRect().height / MM;
    return h <= CELL_H + 0.1 ? 1 : h <= CELL_H * 2 + 0.1 ? 2 : 0;
  });
  box.remove();
  return spans;
}

// 指示書を枠に並べる（左上から右へ、次の段へ）。縦2枠の注文は同じ列の上下2枠を使う。
// 今のページに入らなければ次のページへ。1ページを使う注文は単独のページにし、
// 前のページの空き枠はその後の注文で続けて埋める（空き枠だらけのページを作らない）
function layoutSheets(htmls, spans) {
  const sheets = [];
  let cur = null;
  const fits = (grid, r, c, n) => r + n <= ROWS && [...Array(n).keys()].every(k => !grid[r + k][c]);
  const findCell = (grid, n) => {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (fits(grid, r, c, n)) return [r, c];
    return null;
  };
  htmls.forEach((html, i) => {
    const n = spans[i];
    if (n === 0) { sheets.push(`<div class="sheet whole">${html}</div>`); return; }
    let pos = cur && findCell(cur.grid, n);
    if (!pos) {
      cur = { grid: [...Array(ROWS)].map(() => Array(COLS).fill(false)), slips: [] };
      sheets.push(cur);
      pos = findCell(cur.grid, n);
    }
    const [r, c] = pos;
    for (let k = 0; k < n; k++) cur.grid[r + k][c] = true;
    const cut = (c < COLS - 1 ? " cut-r" : "") + (r + n < ROWS ? " cut-b" : "");
    cur.slips.push(html.replace('<div class="slip">',
      `<div class="slip${cut}" style="grid-column:${c + 1};grid-row:${r + 1} / span ${n};">`));
  });
  return sheets.map(s => typeof s === "string" ? s : `<div class="sheet">${s.slips.join("")}</div>`).join("");
}

document.getElementById("printBtn").addEventListener("click", async () => {
  const list = selected();
  const msg = document.getElementById("msg");
  if (!list.length) { alert("印刷する注文を選択してください"); return; }
  const reprint = list.filter(o => o.printedAt);
  if (reprint.length && !confirm(`再印刷です。\n選択した ${list.length}件のうち ${reprint.length}件は印刷済みです`
      + `（${reprint.map(o => o.orderId).slice(0, 3).join("、")}${reprint.length > 3 ? " ほか" : ""}）。\n印刷しますか？`)) return;

  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  const printedAt = `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const htmls = list.map((o, i) => slipHtml(o, printedAt, i + 1, list.length));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;   // 文字の幅が確定してから高さを測る
  const area = document.getElementById("printArea");
  area.innerHTML = layoutSheets(htmls, measureSpans(htmls));
  renderBarcodes(area);
  document.body.classList.remove("print-pick");
  window.print();

  // 印刷ダイアログでキャンセルされた場合を記録しないよう、印刷できたかを確認してから印刷日時を記録する
  if (!confirm(`${list.length}件の出荷指示書を印刷できましたか？\nOK を押すと印刷日時を記録します（キャンセルで記録しない）。`)) return;
  msg.textContent = "印刷日時を記録しています…";
  let r;
  try {
    // 「印刷記録」シートに注文IDで追記する（本日出荷リストには書かない）
    r = await apiPost({ action: "printed", orderIds: list.map(o => o.orderId), device: deviceName() });
  } catch (e) {
    r = { result: "error", error: "network" };
  }
  if (r.result !== "ok") {
    msg.textContent = `印刷日時を記録できませんでした（${r.error}）。指示書は印刷済みなので、担当者に連絡してください。`;
    return;
  }
  const done = `${r.recorded}件の印刷を記録しました（${r.printedAt}）。`;
  await load();
  msg.textContent = done;
});

/* ---- ピッキングリスト（未処理の注文すべて。選択・印刷済みかに関係なく、自社出荷の商品の総量） ---- */
function pickHtml(p, printedAt) {
  const tags = r => (r.warnOrders.length ? `<span class="tag warn">要確認</span>` : "")
    + (r.unregistered ? `<span class="tag">商品マスタ未登録</span>` : "")
    + (r.shelves.length > 1 ? `<span class="tag">棚番号が複数</span>` : "");
  let sepDone = false;
  const rows = p.rows.map(r => {
    // 棚番号が空欄の商品は最後にまとめる（区切りの見出しをつける）
    const sep = !r.shelf && !sepDone && (sepDone = true)
      ? `<tr class="sep"><td colspan="5">棚番号なし（商品名順）</td></tr>` : "";
    return sep + `<tr>
      <td class="chk"><span></span></td>
      <td class="shelf${r.shelf ? "" : " none"}">${r.shelf ? escapeHtml(r.shelf) : "―"}${r.shelves.length > 1
        ? `<small>${r.shelves.slice(1).map(escapeHtml).join("<br>")}</small>` : ""}</td>
      <td class="name">${escapeHtml(r.name)}${tags(r)}<span class="jan">${r.jan ? "JAN " + escapeHtml(r.jan) : "JAN未登録"}</span></td>
      <td class="qty">${r.qty}<small> 点</small></td>
      <td class="cnt">${r.orderCount}件</td>
    </tr>`;
  }).join("");
  const notices = [];
  if (!p.selfShipFilter) notices.push("※ 商品マスタに「自社出荷(毛呂山)」列が無いため、出荷元で絞り込んでいません。");
  if (p.excludedQty) notices.push(`※ 自社出荷(毛呂山)のチェックが無い商品 ${p.excludedQty}点は数えていません。`);
  const warns = p.warnOrders.length ? `<div class="warn-list"><b>要確認の注文（${p.warnOrders.length}件）</b>
      — 取り出す前に担当者に確認してください${p.warnOrders.map(w =>
        `<div>${escapeHtml(w.orderId)}　${escapeHtml(w.warning)}</div>`).join("")}</div>` : "";
  return `<div class="pick">
    <div class="head"><h2>ピッキングリスト</h2>
      <div class="meta">印刷 ${escapeHtml(printedAt)}<br>未処理の注文 ${p.orderCount}件・自社出荷(毛呂山)の商品</div></div>
    ${notices.map(n => `<p class="notice">${escapeHtml(n)}</p>`).join("")}
    <table>
      <thead><tr><th>取出</th><th>棚番号</th><th>商品名 / JAN</th><th style="text-align:right;">合計数量</th><th style="text-align:right;">注文数</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="total">${p.rows.length}品目　総点数 <b>${p.totalQty}</b> 点</div>
    ${warns}
  </div>`;
}

document.getElementById("pickBtn").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  msg.textContent = "ピッキングリストを作っています…";
  let list, master;
  try {
    // 印刷の直前の最新の状態で作る（本日出荷リストと商品マスタの棚番号）
    [list, master] = await Promise.all([apiGet("list"), apiGet("master")]);
  } catch (e) {
    msg.textContent = e.message;
    return;
  }
  const p = window.PickList.build(list.orders || [], master);
  if (!p.rows.length) { msg.textContent = "ピッキングする商品がありません（未処理の注文がありません）。"; return; }
  msg.textContent = (master.notes || []).join(" / ");
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  const printedAt = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  document.getElementById("pickArea").innerHTML = pickHtml(p, printedAt);
  document.body.classList.add("print-pick");
  window.print();
});

window.Common.ensureKey(document.getElementById("keyArea"), load);
</script>
</body>
</html>
